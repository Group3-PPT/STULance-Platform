<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="STULance - Nền tảng kết nối sinh viên tài năng với doanh nghiệp. Tìm việc làm thêm, thực tập, dự án freelance cho sinh viên và tuyển dụng nhân sự trẻ chất lượng cao." />
    <meta name="keywords" content="việc làm thêm sinh viên, thực tập, freelance, tuyển dụng, kết nối doanh nghiệp, sinh viên, jobs, internship" />
    <meta name="author" content="STULance" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#020617" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="STULance - Kết nối Sinh viên & Doanh nghiệp" />
    <meta property="og:description" content="Nền tảng kết nối sinh viên tài năng với doanh nghiệp. Việc làm thêm, thực tập, freelance chất lượng." />
    <meta property="og:url" content="https://stulance-platform.vercel.app" />
    <meta property="og:locale" content="vi_VN" />

    <!-- Canonical -->
    <link rel="canonical" href="https://stulance-platform.vercel.app" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>STULance - Kết nối Sinh viên & Doanh nghiệp</title>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "STULance",
      "url": "https://stulance-platform.vercel.app",
      "description": "Nền tảng kết nối sinh viên tài năng với doanh nghiệp",
      "inLanguage": "vi",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://stulance-platform.vercel.app/jobs?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "STULance",
      "url": "https://stulance-platform.vercel.app",
      "logo": "https://stulance-platform.vercel.app/favicon.svg",
      "description": "Nền tảng kết nối sinh viên freelancer với doanh nghiệp. Việc làm thêm, thực tập, dự án freelance chất lượng.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "Vietnamese"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
